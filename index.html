<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aetherfall: Nexus Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <canvas id="particles-canvas"></canvas>
  <div class="scanline"></div>

  <!-- LOADING SCREEN (JPG ফিক্স) -->
  <div id="loading">
    <div class="loading-bg" style="background-image: url('assets/bg_loading.jpg');"></div>
    <div class="loading-content">
      <h1 class="loading-logo">AETHERFALL</h1>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <p class="loading-tip">Connecting to orbital station...</p>
    </div>
  </div>

  <!-- TOP HUD -->
  <header class="top-hud">
    <div class="profile-box">
      <img src="assets/char_default.png" class="profile-img" onerror="this.src='https://via.placeholder.com/50/111/00f3ff'">
      <div class="level-badge">1</div>
    </div>

    <div class="resource-scroll">
      <div class="res-item">
        <div class="icon-box"><img src="assets/icon_gem.png" onerror="this.src='https://via.placeholder.com/30/00f3ff/000000'"></div>
        <span id="ui-gems">50</span>
      </div>
      <div class="res-item">
        <div class="icon-box"><img src="assets/icon_iron.png" onerror="this.src='https://via.placeholder.com/30/888/000000'"></div>
        <span id="ui-iron">1000</span>
      </div>
      <div class="res-item">
        <div class="icon-box"><img src="assets/icon_titanium.png" onerror="this.src='https://via.placeholder.com/30/fff/000000'"></div>
        <span id="ui-tita">500</span>
      </div>
      <div class="res-item">
        <div class="icon-box"><img src="assets/icon_dm.png" onerror="this.src='https://via.placeholder.com/30/f0f/000000'"></div>
        <span id="ui-dm">10</span>
      </div>
      <div class="res-item">
        <div class="icon-box"><img src="assets/icon_pc.png" onerror="this.src='https://via.placeholder.com/30/f00/000000'"></div>
        <span id="ui-pc">5</span>
      </div>
    </div>
  </header>

  <!-- MAIN SCREEN: OUTPOST (BASE BUILDING - JPG ফিক্স) -->
  <div class="screen active" id="outpost">
    <!-- Isometric Base Background -->
    <div class="base-map" style="background-image: url('assets/bg_base.jpg');">
      <div class="map-grid-overlay"></div>
      
      <!-- Interactive Buildings (Buildings are PNG) -->
      <div class="building-node" style="top: 30%; left: 40%;" onclick="openBuildingModal('Command Center', 'build_command.png')">
        <img src="assets/build_command.png" class="building-img" onerror="this.style.display='none'">
        <div class="building-shadow"></div>
      </div>
      
      <div class="building-node" style="top: 55%; left: 20%;" onclick="openBuildingModal('Resource Storage', 'build_storage.png')">
        <img src="assets/build_storage.png" class="building-img" onerror="this.style.display='none'">
        <div class="building-shadow"></div>
      </div>

      <div class="building-node" style="top: 45%; right: 20%;" onclick="openBuildingModal('Shield Generator', 'build_shield.png')">
        <img src="assets/build_shield.png" class="building-img" onerror="this.style.display='none'">
        <div class="building-shadow"></div>
      </div>

      <div class="building-node" style="top: 65%; right: 35%;" onclick="openBuildingModal('Defense Turret', 'build_turret.png')">
        <img src="assets/build_turret.png" class="building-img" onerror="this.style.display='none'">
        <div class="building-shadow"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT NAVIGATION -->
  <nav class="side-nav">
    <button class="nav-item active" data-target="outpost">
      <div class="nav-icon"><img src="assets/nav_outpost.png" onerror="this.src='https://via.placeholder.com/40'"></div>
      <span>Outpost</span>
    </button>
    <button class="nav-item" data-target="armory">
      <div class="nav-icon"><img src="assets/nav_armory.png" onerror="this.src='https://via.placeholder.com/40'"></div>
      <span>Armory</span>
    </button>
    <button class="nav-item" data-target="sector">
      <div class="nav-icon"><img src="assets/nav_sector.png" onerror="this.src='https://via.placeholder.com/40'"></div>
      <span>Sector</span>
    </button>
    <button class="nav-item" data-target="arena">
      <div class="nav-icon"><img src="assets/nav_arena.png" onerror="this.src='https://via.placeholder.com/40'"></div>
      <span>Arena</span>
    </button>
    <button class="nav-item" data-target="vault">
      <div class="nav-icon"><img src="assets/nav_vault.png" onerror="this.src='https://via.placeholder.com/40'"></div>
      <span>Vault</span>
    </button>
  </nav>

  <!-- BUILDING MODAL -->
  <div id="building-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="glow-cyan">Building</h2>
      <img id="modal-img" src="" class="modal-img">
      <p id="modal-desc">Upgrade to increase efficiency and power.</p>
      <button class="btn btn-cyan" onclick="upgradeBuilding()">UPGRADE (Cost: 1000 Iron)</button>
      <button class="btn btn-cancel" onclick="closeModal()">CANCEL</button>
    </div>
  </div>

  <script src="app.js?v=1.0"></script>
</body>
</html>
