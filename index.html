<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aetherfall: Nexus Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <canvas id="particles-canvas"></canvas>
  <div class="vignette"></div>

  <!-- LOADING SCREEN -->
  <div id="loading">
    <div class="loading-bg" style="background-image: url('assets/bg_loading.jpg');"></div>
    <div class="loading-content">
      <h1 class="loading-logo">AETHERFALL</h1>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- TOP HUD -->
  <header class="top-hud">
    <div class="profile-box">
      <img src="assets/char_default.png" class="profile-img" onerror="this.src='https://via.placeholder.com/50/111/00f3ff'">
      <div class="level-badge" id="ui-cc-level">1</div>
    </div>
    <div class="resource-scroll">
      <div class="res-item"><img src="assets/icon_gem.png"><span id="ui-gems">0</span></div>
      <div class="res-item"><img src="assets/icon_iron.png"><span id="ui-iron">0</span></div>
      <div class="res-item"><img src="assets/icon_titanium.png"><span id="ui-tita">0</span></div>
      <div class="res-item"><img src="assets/icon_dm.png"><span id="ui-dm">0</span></div>
      <div class="res-item"><img src="assets/icon_pc.png"><span id="ui-pc">0</span></div>
    </div>
  </header>

  <!-- NEW TOP CONTROLS (Moved from bottom) -->
  <div class="top-controls">
    <button class="action-btn" onclick="openBuildMenu()">
      <img src="assets/icon_build.png" onerror="this.style.display='none'">
      <span>BUILD</span>
    </button>
    <div class="builder-status">
      <img src="assets/build_builderhut.png" style="width:24px; height:24px; object-fit:contain;">
      <span id="ui-builder-text">1 / 3 Builders</span>
    </div>
  </div>

  <!-- MAIN SCREEN: OUTPOST -->
  <div class="screen active" id="outpost">
    <div class="base-map" style="background-image: url('assets/bg_base.jpg');" id="base-map">
      <div class="map-grid-overlay"></div>
      <div id="building-container"></div>
    </div>
  </div>

  <!-- RIGHT NAV DOCK (Made Bigger) -->
  <div class="nav-dock">
    <nav class="side-nav">
      <button class="nav-item active"><div class="nav-icon"><img src="assets/nav_outpost.png"></div><span>Outpost</span></button>
      <button class="nav-item"><div class="nav-icon"><img src="assets/nav_armory.png"></div><span>Armory</span></button>
      <button class="nav-item"><div class="nav-icon"><img src="assets/nav_sector.png"></div><span>Sector</span></button>
      <button class="nav-item"><div class="nav-icon"><img src="assets/nav_arena.png"></div><span>Arena</span></button>
    </nav>
  </div>

  <!-- BUILD MENU MODAL -->
  <div id="build-menu-modal" class="modal">
    <div class="modal-content" style="max-width: 90%; width: 400px;">
      <h2 class="glow-cyan">BUILDINGS</h2>
      <div class="build-grid" id="build-grid"></div>
      <button class="btn btn-cancel" onclick="closeModals()">CLOSE</button>
    </div>
  </div>

  <!-- BUILDING INTERACTION MODAL -->
  <div id="building-modal" class="modal">
    <div class="modal-content">
      <h2 id="b-modal-title" class="glow-cyan">Building</h2>
      <img id="b-modal-img" src="" class="modal-img">
      
      <div class="building-stats">
        <div class="stat-row"><span>Level:</span> <span id="b-modal-level">1</span> / 15</div>
        <div class="stat-row" id="b-modal-stat-row"><span id="b-modal-stat-label">Production:</span> <span id="b-modal-stat-val">0</span></div>
        
        <div class="upgrade-info" id="b-modal-upgrade-info" style="display:none;">
          <div style="color:#00ff88; font-size:12px;">Next Lvl: <span id="next-stat-val"></span></div>
        </div>

        <div class="stat-row" id="b-modal-storage-row" style="display:none;"><span>Storage:</span> <span id="b-modal-storage">0/0</span></div>
        <div class="stat-row" id="b-modal-time-row" style="color: #ff00ff; display:none;"><span>Time:</span> <span id="b-modal-time">0s</span></div>
      </div>

      <button class="btn btn-cyan" id="btn-claim" onclick="claimResources()" style="display:none;">CLAIM RESOURCES</button>
      
      <div class="upgrade-costs" id="b-modal-cost-container">
        <h4 style="color:var(--gold); font-size:12px; margin-bottom:5px;">Upgrade Costs:</h4>
        <div class="cost-grid" id="b-modal-costs"></div>
      </div>

      <button class="btn btn-magenta" id="btn-upgrade" onclick="upgradeBuilding()">UPGRADE</button>
      <button class="btn btn-cancel" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <!-- SIGNUP BONUS POPUP -->
  <div id="signup-modal" class="modal">
    <div class="modal-content" style="border-color: var(--gold); box-shadow: 0 0 50px rgba(252,226,5,0.4);">
      <h2 class="glow-cyan" style="color:var(--gold); text-shadow: 0 0 10px var(--gold);">WELCOME COMMANDER!</h2>
      <p style="color:#ddd; font-size:14px; margin-bottom:15px;">First Time Signup Bonus Received!</p>
      
      <div class="bonus-grid">
        <div class="bonus-item"><img src="assets/icon_gem.png"> 100</div>
        <div class="bonus-item"><img src="assets/icon_iron.png"> 100K</div>
        <div class="bonus-item"><img src="assets/icon_titanium.png"> 10K</div>
        <div class="bonus-item"><img src="assets/icon_dm.png"> 100</div>
        <div class="bonus-item"><img src="assets/icon_pc.png"> 10</div>
      </div>

      <button class="btn btn-cyan" onclick="claimSignupBonus()" style="background:linear-gradient(180deg, #b38f00, #665200); color:white; border-color:gold;">CLAIM BONUS</button>
    </div>
  </div>

  <script src="app.js?v=8.0"></script>
</body>
</html>
