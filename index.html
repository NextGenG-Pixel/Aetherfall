<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aetherfall: Nexus Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css?v=3.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading">
    <div class="loader-logo">AETHERFALL</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- TOP HUD -->
  <div class="top-hud" id="global-hud">
    <div class="res-pill"><img src="assets/icon_gem.jpg" onerror="this.src='https://via.placeholder.com/20/00f3ff'"> <span id="ui-gems">50</span></div>
    <div class="res-pill"><img src="assets/token_iron.jpg" onerror="this.src='https://via.placeholder.com/20/888'"> <span id="ui-iron">500</span></div>
    <div class="res-pill"><img src="assets/token_plasmacore.jpg" onerror="this.src='https://via.placeholder.com/20/f0f'"> <span id="ui-pc">5</span></div>
  </div>

  <!-- 1. OUTPOST -->
  <div class="screen active" id="outpost">
    <div class="bg" style="background-image: url('assets/bg_home.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="outpost-content">
      <h1 class="total-power" id="ui-total-power">POWER: 0</h1>
      <div class="char-area">
        <img src="assets/char_default.png" class="main-char" id="ui-main-char" onerror="this.src='https://via.placeholder.com/250/000000/00f3ff?text=CHAR'">
        <div class="hud-slot slot-w"><img id="ui-slot-wep" src=""></div>
        <div class="hud-slot slot-p"><img id="ui-slot-pet" src=""></div>
      </div>
      <div class="action-area">
        <button class="btn btn-magenta" onclick="nav('arena', this)">FIGHT (PVP)</button>
        <button class="btn btn-cyan" onclick="nav('sector', this)">BOSS (PVE)</button>
      </div>
    </div>
  </div>

  <!-- 2. ARMORY -->
  <div class="screen" id="armory">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="armory-tabs">
      <div class="tab active">Inventory</div>
    </div>
    <div class="inventory-grid" id="ui-inventory">
      <!-- Cards rendered by JS -->
    </div>
  </div>

  <!-- 3. ARENA (PVP) -->
  <div class="screen" id="arena">
    <div class="bg" style="background-image: url('assets/bg_battle.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="battle-hud">
      <div><div class="name-plate">COMMANDER</div><div class="hp-container"><div class="hp-fill hp-player" id="p-hp"></div></div></div>
      <div class="vs-logo">VS</div>
      <div style="text-align:right;"><div class="name-plate">ENEMY</div><div class="hp-container"><div class="hp-fill hp-enemy" id="e-hp"></div></div></div>
    </div>
    
    <div class="arena-floor">
      <img class="fighter-img p-fighter-img" id="p-char-img" src="assets/char_default.png">
      <img class="pet-img left-pet" id="p-pet-img" src="assets/pet_dog_attack.png">
      
      <img class="fighter-img e-fighter-img" id="e-char-img" src="assets/char_epic.png">
      <img class="pet-img right-pet" id="e-pet-img" src="assets/pet_dragon_attack.png">
    </div>
    
    <div class="battle-controls">
      <button class="btn btn-magenta" onclick="startBattle()" id="btn-fight">START ATTACK</button>
    </div>
  </div>

  <!-- 4. SECTOR (PVE BOSS) -->
  <div class="screen" id="sector">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="boss-container">
      <h1 class="glow-magenta">MECH BOSS</h1>
      <div class="hp-container" style="width: 80%; height: 20px;"><div class="hp-fill hp-enemy" id="boss-hp" style="width:100%"></div></div>
      <button class="btn btn-cyan" onclick="fightBoss()" id="btn-boss">ATTACK BOSS</button>
    </div>
  </div>

  <!-- 5. VAULT (TOKENOMICS) -->
  <div class="screen" id="vault">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="vault-content">
      <h1 class="glow-cyan">$ATHF VAULT</h1>
      <div class="vault-card">
        <h3 style="color:var(--gold); margin-bottom:10px;">Requirements</h3>
        <p>Iron: 10,000 / 100k</p>
        <p>Titanium: 1,000 / 50k</p>
        <p>Dark Matter: 10 / 5k</p>
        <p>Plasma Core: 1 / 500</p>
      </div>
      <button class="btn btn-magenta" style="opacity:0.5;">WITHDRAW LOCKED</button>
    </div>
  </div>

  <!-- MODAL (Unlock / Equip) -->
  <div id="upgrade-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="color:var(--cyan); margin-bottom:10px;">Item Name</h2>
      <img id="modal-img" src="" style="width:100px; margin-bottom:10px;">
      <p id="modal-desc" style="margin-bottom:20px;">Description</p>
      <button class="btn btn-cyan" id="btn-modal-action">ACTION</button>
      <button class="btn" style="margin-top:10px; background:#333;" onclick="closeModal()">CANCEL</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav" id="global-nav">
    <button class="nav-btn active" onclick="nav('outpost', this)"><i class="ph-duotone ph-planet"></i>Outpost</button>
    <button class="nav-btn" onclick="nav('armory', this)"><i class="ph-duotone ph-sword"></i>Armory</button>
    <button class="nav-btn" onclick="nav('sector', this)"><i class="ph-duotone ph-globe"></i>Sector</button>
    <button class="nav-btn" onclick="nav('arena', this)"><i class="ph-duotone ph-trophy"></i>Arena</button>
    <button class="nav-btn" onclick="nav('vault', this)"><i class="ph-duotone ph-vault"></i>Vault</button>
  </div>

  <script src="app.js?v=3.0"></script>
</body>
</html>
