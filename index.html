<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aetherfall: Nexus Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css?v=7.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- DYNAMIC PARTICLES BACKGROUND -->
  <canvas id="particles-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading">
    <div class="loader-logo">AETHERFALL</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- TOP HUD -->
  <div class="top-hud" id="global-hud">
    <div class="res-pill"><img src="assets/icon_gem.png" onerror="this.src='https://via.placeholder.com/20/00f3ff'"> <span id="ui-gems">50</span></div>
    <div class="res-pill"><img src="assets/token_iron.png" onerror="this.src='https://via.placeholder.com/20/888'"> <span id="ui-iron">1000</span></div>
    <div class="res-pill"><img src="assets/token_plasmacore.png" onerror="this.src='https://via.placeholder.com/20/f0f'"> <span id="ui-pc">5</span></div>
  </div>

  <!-- 1. OUTPOST -->
  <div class="screen active" id="outpost">
    <div class="bg" style="background-image: url('assets/bg_home.jpg');"></div>
    <div class="bg-overlay"></div>
    
    <div class="outpost-content">
      <h1 class="total-power" id="ui-total-power">POWER: 0</h1>
      
      <div class="char-area">
        <div class="holo-ring"></div>
        <!-- Main Character Image -->
        <img src="assets/char_default.png" class="main-char" id="ui-main-char" onerror="this.src='https://via.placeholder.com/250/000000/00f3ff?text=CHAR'">
        
        <!-- HUD Slots -->
        <div class="hud-slot slot-w"><img id="ui-slot-wep" src="assets/wep_rifle_normal.png"></div>
        <div class="hud-slot slot-p"><img id="ui-slot-pet" src="assets/pet_dog_normal.png"></div>
      </div>
      
      <div class="action-area">
        <button class="btn btn-magenta" onclick="nav('arena', this)">FIGHT (PVP)</button>
        <button class="btn btn-cyan" onclick="nav('sector', this)">BOSS (PVE)</button>
      </div>
    </div>
  </div>

  <!-- 2. ARMORY -->
  <div class="screen" id="armory">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="inventory-grid" id="ui-inventory"></div>
  </div>

  <!-- 3. ARENA (PVP) -->
  <div class="screen" id="arena">
    <div class="bg" style="background-image: url('assets/bg_battle.jpg');"></div>
    <div class="bg-overlay"></div>
    
    <div class="battle-hud">
      <div><div class="name-plate glow-cyan">COMMANDER</div><div class="hp-container"><div class="hp-fill hp-player" id="p-hp"></div></div></div>
      <div class="vs-logo">VS</div>
      <div style="text-align:right;"><div class="name-plate glow-magenta">SHADOW</div><div class="hp-container"><div class="hp-fill hp-enemy" id="e-hp"></div></div></div>
    </div>
    
    <div class="arena-floor" id="arena-floor">
      <div class="fighter-container">
        <img class="fighter-img p-fighter-img" id="p-char-img" src="assets/char_default.png">
        <img class="pet-img left-pet" id="p-pet-img" src="assets/pet_dog_normal.png">
      </div>
      
      <div class="fighter-container enemy-side">
        <!-- Enemy Images -->
        <img class="fighter-img e-fighter-img" id="e-char-img" src="assets/char_enemy.png">
        <img class="pet-img right-pet" id="e-pet-img" src="assets/pet_dragon_legendary.png">
      </div>
    </div>
    
    <div class="battle-controls">
      <button class="btn btn-magenta" onclick="startBattle()" id="btn-fight">START ATTACK</button>
    </div>
  </div>

  <!-- 4. SECTOR (PVE BOSS) -->
  <div class="screen" id="sector">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="boss-container">
      <h1 class="glow-magenta">MECH BOSS</h1>
      <div class="hp-container" style="width: 100%; height: 24px; box-shadow: 0 0 20px red;"><div class="hp-fill hp-enemy" id="boss-hp" style="width:100%"></div></div>
      <button class="btn btn-cyan" onclick="fightBoss()" id="btn-boss">ATTACK BOSS</button>
    </div>
  </div>

  <!-- 5. VAULT (TOKENOMICS) -->
  <div class="screen" id="vault">
    <div class="bg" style="background-image: url('assets/bg_page.jpg');"></div>
    <div class="bg-overlay"></div>
    <div class="vault-content">
      <h1 class="glow-cyan">$ATHF VAULT</h1>
      <div class="vault-card">
        <h3 style="color:var(--gold); margin-bottom:15px; font-family:'Orbitron';">REQUIREMENTS</h3>
        <div class="vault-row"><span>Iron</span> <span>10,000 / 100k</span></div>
        <div class="vault-row"><span>Titanium</span> <span>1,000 / 50k</span></div>
        <div class="vault-row"><span>Dark Matter</span> <span>10 / 5k</span></div>
        <div class="vault-row"><span>Plasma Core</span> <span>1 / 500</span></div>
      </div>
      <button class="btn btn-magenta" style="opacity:0.5;">WITHDRAW LOCKED</button>
    </div>
  </div>

  <!-- MODAL -->
  <div id="upgrade-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="glow-cyan" style="margin-bottom:15px;">Item Name</h2>
      <img id="modal-img" src="" style="width:140px; margin-bottom:20px; object-fit:contain; height:140px; filter: drop-shadow(0 0 20px var(--cyan));">
      <p id="modal-desc" style="margin-bottom:20px;">Description</p>
      <button class="btn btn-cyan" id="btn-modal-action">ACTION</button>
      <button class="btn" style="margin-top:10px; background:#333; color:#aaa;" onclick="closeModal()">CANCEL</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav" id="global-nav">
    <button class="nav-btn active" onclick="nav('outpost', this)"><i class="ph-duotone ph-planet"></i>Outpost</button>
    <button class="nav-btn" onclick="nav('armory', this)"><i class="ph-duotone ph-sword"></i>Armory</button>
    <button class="nav-btn" onclick="nav('sector', this)"><i class="ph-duotone ph-globe"></i>Sector</button>
    <button class="nav-btn" onclick="nav('arena', this)"><i class="ph-duotone ph-trophy"></i>Arena</button>
    <button class="nav-btn" onclick="nav('vault', this)"><i class="ph-duotone ph-vault"></i>Vault</button>
  </div>

  <script src="app.js?v=7.0"></script>
</body>
</html>
